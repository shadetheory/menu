[package]
name = "omarchy-menu-rust"
version = "0.1.0"
edition = "2021"
publish = false
description = "Alongside-stock Omarchy menu scaffold. Does not replace the stock menu."
license = "AGPL-3.0-only"

[dependencies]
fontdue = "0.9.3"
notify = "6.1.1"
png = "0.17.16"
serde_json = { version = "1.0", features = ["preserve_order"] }
smithay-client-toolkit = "0.19.2"
softbuffer = "=0.4.6"
tiny-skia = "0.11.4"
winit = { version = "=0.30.9", default-features = false, features = ["x11", "wayland", "rwh_06"] }

[profile.release]
lto = false
codegen-units = 16
